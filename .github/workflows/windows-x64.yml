name: Windows x64 Portable Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "3rdparty/**"
      - ".gitmodules"
      - ".github/workflows/windows-x64.yml"

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build portable Windows x64
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add Visual Studio Clang to PATH
        shell: pwsh
        run: |
          $clangDir = Join-Path $env:VCINSTALLDIR "Tools\Llvm\x64\bin"
          if (!(Test-Path (Join-Path $clangDir "clang-cl.exe"))) {
            throw "Visual Studio clang-cl.exe is unavailable: $clangDir"
          }
          $clangDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command vcpkg -ErrorAction Stop).Source
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-windows-x64-opt-${{ hashFiles('.github/workflows/windows-x64.yml') }}

      - name: Install glslang shader tools
        shell: pwsh
        run: |
          $root = "${{ steps.vcpkg.outputs.root }}"
          $validator = Join-Path $root "installed\x64-windows\tools\glslang\glslangValidator.exe"
          if (!(Test-Path $validator)) {
            vcpkg install "glslang[tools,opt]:x64-windows"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          (Split-Path $validator) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Verify build tools
        shell: pwsh
        run: |
          python --version
          cmake --version
          ninja --version
          clang-cl --version
          glslangValidator --version
          if (!$env:Qt6_DIR) { throw "Qt6_DIR not set" }

      - name: Configure Release
        shell: pwsh
        run: |
          cmake -S . -B _Build/windows-x64 -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR" `
            "-DKYTY_BUILD_ORIGIN=Fork" `
            "-DKYTY_BUILD_REPOSITORY=$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build launcher and emulator
        shell: pwsh
        run: |
          cmake --build _Build/windows-x64 --target launcher --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage portable distribution
        shell: pwsh
        run: |
          cmake --install _Build/windows-x64 --prefix _Build/windows-x64/install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = "_Build/windows-x64/install"
          $files = @(Get-ChildItem -Path $stage -Recurse -Filter *.exe -File)
          if ($files.Count -eq 0) { throw "No Windows executables found in $stage" }
          $files | ForEach-Object { Write-Host "Packaged: $($_.FullName)" }

      - name: Upload Windows x64 portable build
        uses: actions/upload-artifact@v4
        with:
          name: VIcky-Blue-Windows-x64
          path: _Build/windows-x64/install/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
